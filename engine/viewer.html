<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --bg:#0b0d12; --grid:rgba(255,255,255,.055); --panel:#10131a; --panel-2:#161a23;
  --card:#141822; --card-hi:#1a1f2c; --border:#252b39; --border-hi:#3b4458;
  --text:#e8ebf1; --muted:#9aa3b5; --faint:#687085; --accent:#8d9cff; --accent-ink:#0b0d12;
  --edge:#3b4457; --edge-hi:#c3cbff; --shadow:rgba(0,0,0,.5); --glow:rgba(141,156,255,.28);
  --k-entry:#fbbf24; --k-module:#818cf8; --k-process:#a78bfa; --k-service:#c084fc; --k-ui:#f472b6;
  --k-data:#34d399; --k-config:#94a3b8; --k-external:#38bdf8; --k-person:#22d3ee; --k-agent:#e879f9;
  --k-skill:#2dd4bf; --k-hook:#fb923c; --k-schedule:#fb7185; --k-doc:#d6d3d1; --k-test:#a3e635;
  --k-group:#a5b4fc; --k-context:#6b7385;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f5f6fa; --grid:rgba(15,23,42,.075); --panel:#ffffff; --panel-2:#f1f3f8;
  --card:#ffffff; --card-hi:#fafbff; --border:#e1e5ee; --border-hi:#c4cbdb;
  --text:#121622; --muted:#596275; --faint:#8a93a6; --accent:#4f5bd5; --accent-ink:#ffffff;
  --edge:#b3bacb; --edge-hi:#4f5bd5; --shadow:rgba(15,23,42,.12); --glow:rgba(79,91,213,.2);
  --k-entry:#d97706; --k-module:#4f46e5; --k-process:#7c3aed; --k-service:#9333ea; --k-ui:#db2777;
  --k-data:#059669; --k-config:#475569; --k-external:#0284c7; --k-person:#0891b2; --k-agent:#c026d3;
  --k-skill:#0d9488; --k-hook:#ea580c; --k-schedule:#e11d48; --k-doc:#78716c; --k-test:#65a30d;
  --k-group:#6366f1; --k-context:#94a3b8;
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6fa; --grid:rgba(15,23,42,.075); --panel:#ffffff; --panel-2:#f1f3f8;
    --card:#ffffff; --card-hi:#fafbff; --border:#e1e5ee; --border-hi:#c4cbdb;
    --text:#121622; --muted:#596275; --faint:#8a93a6; --accent:#4f5bd5; --accent-ink:#ffffff;
    --edge:#b3bacb; --edge-hi:#4f5bd5; --shadow:rgba(15,23,42,.12); --glow:rgba(79,91,213,.2);
    --k-entry:#d97706; --k-module:#4f46e5; --k-process:#7c3aed; --k-service:#9333ea; --k-ui:#db2777;
    --k-data:#059669; --k-config:#475569; --k-external:#0284c7; --k-person:#0891b2; --k-agent:#c026d3;
    --k-skill:#0d9488; --k-hook:#ea580c; --k-schedule:#e11d48; --k-doc:#78716c; --k-test:#65a30d;
    --k-group:#6366f1; --k-context:#94a3b8;
    color-scheme: light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:288px 1fr auto;height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 0 auto}
.brand .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--k-agent));color:var(--accent-ink)}
.brand .bn{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand .product{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:650;white-space:nowrap;text-decoration:none}
.brand .product:hover{color:var(--accent)}
.brand .name{font-weight:650;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;font-size:13px}
.crumbs button{background:none;border:0;padding:5px 8px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.crumbs button:hover{background:var(--panel-2);color:var(--text)}
.crumbs button.here{color:var(--text);font-weight:600;cursor:default;background:none}
.crumbs .sep{color:var(--faint);font-size:12px}
.tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.search{position:relative}
.search input{width:240px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:0 12px 0 32px;font:inherit;font-size:13px;outline:none;transition:border-color .15s, box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.search svg{position:absolute;left:10px;top:10px;color:var(--faint)}
.search kbd{position:absolute;right:9px;top:8px;font:11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.results{position:absolute;top:40px;right:0;width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 50px var(--shadow);padding:6px;display:none}
.results.open{display:block}
.results button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button.active{background:var(--panel-2)}
.results .r-label{font-size:13px;font-weight:600}
.results .r-path{font-size:11.5px;color:var(--faint);margin-top:2px}
.results .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.results .empty{padding:12px;color:var(--faint);font-size:13px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--border-hi)}
.iconbtn.menu{display:none}

aside.left{border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:18px 16px 24px;z-index:3}
.sec{margin-bottom:22px}
.sec h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:650;margin:0 0 10px}
.ov-title{font-size:17px;font-weight:650;letter-spacing:-.015em;margin:0 0 6px;line-height:1.3}
.ov-sum{font-size:13px;line-height:1.55;color:var(--muted);margin:0}
.stats{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.stat{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.flow-item{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s, background .15s}
.flow-item:hover{border-color:var(--border-hi)}
.flow-item.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.flow-item .fi-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.flow-item .fi-name svg{color:var(--accent);flex:0 0 auto}
.flow-item .fi-sum{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:6px 8px 6px 32px;font-size:12.5px;line-height:1.45;color:var(--muted);border-radius:8px;cursor:pointer}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:6px;top:6px;width:19px;height:19px;border-radius:50%;background:var(--panel);border:1px solid var(--border-hi);font-size:10.5px;display:grid;place-items:center;color:var(--muted);font-weight:650}
.steps li.done{color:var(--text)}
.steps li.done::before{border-color:var(--accent);color:var(--accent)}
.steps li.now{background:var(--panel);color:var(--text)}
.steps li.now::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.meta{font-size:11.5px;color:var(--faint);line-height:1.6;word-break:break-word}
.meta a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border-hi)}
.meta a:hover{color:var(--accent)}
.meta .cov{margin-top:8px;line-height:1.5;word-break:normal}
.meta .credit{margin-top:8px}
.files a{color:inherit;text-decoration:none}
.files a:hover code{border-color:var(--accent);color:var(--accent)}
.muted-note{font-size:12.5px;color:var(--faint);line-height:1.5}

main.stage{position:relative;overflow:hidden;min-width:0}
svg#canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
svg#canvas.dragging{cursor:grabbing}
#viewport{transition:opacity .22s ease}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--faint);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 10px;pointer-events:none;opacity:.92}
.hint b{color:var(--muted);font-weight:600}
.zoom{position:absolute;right:16px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.up{position:absolute;left:16px;top:14px;display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 11px 6px 8px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.up:hover{color:var(--text);border-color:var(--border-hi)}
.up.show{display:flex}
.flowbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:all .25s ease;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border-hi);border-radius:14px;padding:8px 10px;box-shadow:0 18px 50px var(--shadow);max-width:min(720px,calc(100% - 32px))}
.flowbar.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.flowbar .fb-num{font:600 12px var(--mono);color:var(--accent);white-space:nowrap;padding-left:4px}
.flowbar .fb-text{font-size:13px;line-height:1.4;min-width:200px;max-width:460px}
.flowbar .fb-btns{display:flex;gap:4px}
.flowbar button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.flowbar button:hover{color:var(--text)}
.empty-level{position:absolute;inset:0;display:none;place-items:center;color:var(--faint);font-size:14px}
.empty-level.show{display:grid}

aside.right{width:0;overflow:hidden;border-left:1px solid var(--border);background:var(--panel);transition:width .25s ease;z-index:3}
aside.right.open{width:360px}
.panel-inner{width:360px;height:100%;overflow-y:auto;padding:20px 20px 32px}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
.p-title{font-size:20px;font-weight:680;letter-spacing:-.02em;margin:8px 0 8px;line-height:1.25}
.p-sum{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 14px}
.p-details{font-size:13px;line-height:1.6;color:var(--text)}
.p-details p{margin:0 0 10px}
.p-details ul{margin:0 0 10px;padding-left:18px}
.p-details li{margin:3px 0}
.p-details code,.files code{font:12px var(--mono);background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.open-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:6px 0 18px;padding:10px 12px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:13px;cursor:pointer}
.open-btn:hover{filter:brightness(1.06)}
.p-sec{margin-top:18px}
.p-sec h4{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;font-weight:650}
.files{list-style:none;margin:0;padding:0}
.files li{margin:0 0 6px;font-size:12px;word-break:break-all}
.conn{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;margin-bottom:6px;cursor:pointer;text-align:left;font-size:12.5px}
.conn:hover{border-color:var(--border-hi)}
.conn .c-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.conn .c-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn .c-verb{color:var(--faint);font-size:11.5px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
.close{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px}
.close:hover{color:var(--text);background:var(--panel-2)}

/* SVG */
.bg-grid{fill:url(#grid)}
.node{cursor:pointer}
.node .card{fill:var(--card);stroke:var(--border);stroke-width:1;transition:stroke .15s, fill .15s}
.node .sheet{fill:var(--card);stroke:var(--border);stroke-width:1}
.node:hover .card{stroke:var(--border-hi);fill:var(--card-hi)}
.node.selected .card{stroke:var(--kc);stroke-width:1.6}
.node .shadow{fill:var(--shadow);filter:url(#soft)}
.node .bar{fill:var(--kc)}
.node .kind{fill:var(--kc);font-size:10.5px;font-weight:650;letter-spacing:.08em}
.node .kicon{color:var(--kc)}
.node .label{fill:var(--text);font-size:14.5px;font-weight:620;letter-spacing:-.005em}
.node .summary{fill:var(--muted);font-size:12.5px}
.node .foot{fill:var(--accent);font-size:12px;font-weight:600}
.node .footline{stroke:var(--border)}
.node.ghost .card{fill:transparent;stroke:var(--border-hi);stroke-dasharray:4 4}
.node .status{fill:none;stroke:var(--faint)}
.node .status-t{fill:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.08em}
.node.st-planned .card{stroke-dasharray:6 4;fill:var(--bg)}
.node.st-planned .shadow,.node.st-planned .sheet{opacity:.25}
.node.st-deprecated{opacity:.55}
.node.st-deprecated .label{text-decoration:line-through}
.node.ghost .label{fill:var(--muted);font-size:13px}
.node.ghost{cursor:pointer}
.node .badge circle{fill:var(--accent)}
.node .badge text{fill:var(--accent-ink);font-size:11px;font-weight:700}
.edge path.line{fill:none;stroke:var(--edge);stroke-width:1.4;marker-end:url(#arrow);transition:stroke .15s, opacity .2s}
.edge path.hit{fill:none;stroke:transparent;stroke-width:12}
.edge.k-data path.line{stroke-dasharray:5 4}
.edge.k-async path.line,.edge.k-triggers path.line,.edge.k-event path.line{stroke-dasharray:1.5 4;stroke-linecap:round}
.edge .elabel rect{fill:var(--bg);stroke:var(--border)}
.edge .elabel text{fill:var(--muted);font-size:11px}
.edge.hi path.line{stroke:var(--edge-hi);stroke-width:2;marker-end:url(#arrow-hi)}
.edge.hi .elabel rect{stroke:var(--edge-hi)}
.edge.hi .elabel text{fill:var(--text)}
svg.dimming .node:not(.lit){opacity:.28}
svg.dimming .edge:not(.hi){opacity:.18}
.node,.edge{transition:opacity .2s}
svg.flowing .node:not(.f-on){opacity:.22}
svg.flowing .edge:not(.f-on){opacity:.12}
.edge.f-on path.line{stroke:var(--edge-hi);stroke-width:2;marker-end:url(#arrow-hi)}
.edge.f-now path.line{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 6;animation:dash 0.9s linear infinite;marker-end:url(#arrow-acc)}
.node.f-now .card{stroke:var(--accent);stroke-width:2}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{fill:var(--accent);filter:url(#glow)}
.node.flash .card{animation:flash 1.4s ease}
@keyframes flash{0%,60%{stroke:var(--accent);stroke-width:3}100%{stroke-width:1}}

@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  header.top{gap:10px;padding:0 12px;min-width:0;overflow:hidden}
  aside.left{position:absolute;top:56px;bottom:0;left:0;width:288px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:12px 0 40px var(--shadow)}
  aside.left.open{transform:none}
  aside.right{position:absolute;right:0;top:56px;bottom:0}
  aside.right.open{width:min(360px,100%)}
  .panel-inner{width:min(360px,100vw)}
  .iconbtn.menu{display:grid}
  .search input{width:150px}
  .search kbd{display:none}
  .brand .name{max-width:120px}
  .hint{display:none}
}
@media (max-width: 560px){
  .brand .name{display:none}
  .crumbs{font-size:12.5px}
  .crumbs button{padding:5px 5px;max-width:120px}
  .search input{width:38px;padding:0 0 0 30px;color:transparent;cursor:pointer}
  .search input::placeholder{color:transparent}
  .search input:focus{width:min(220px,calc(100vw - 130px));padding:0 10px 0 30px;color:var(--text);cursor:text}
  .results{position:fixed;left:12px;right:12px;top:52px;width:auto}
  .flowbar{left:12px;right:12px;transform:translateY(20px);max-width:none;flex-wrap:wrap}
  .flowbar.show{transform:none}
  .flowbar .fb-text{min-width:0;flex:1 1 100%;order:3;font-size:12.5px}
  .up{top:10px;left:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn menu" id="menuBtn" title="Panel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <div class="brand">
      <div class="logo"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="1.5" width="7" height="3.6" rx="1"/><rect x="4.5" y="6.2" width="7" height="3.6" rx="1"/><rect x="7.5" y="10.9" width="7" height="3.6" rx="1"/></svg></div>
      <div class="bn"><a class="product" id="productLink" target="_blank" rel="noopener">Exploded View</a><div class="name" id="mapName"></div></div>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="tools">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="search" placeholder="Search the whole map" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
        <div class="results" id="results"></div>
      </div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg></button>
    </div>
  </header>
  <aside class="left" id="left">
    <div class="sec" id="overview"></div>
    <div class="sec" id="flowsSec"><h3>Workflows</h3><div id="flows"></div></div>
    <div class="sec"><h3>Legend</h3><div class="legend" id="legend"></div></div>
    <div class="sec" id="metaSec"><h3>Source</h3><div class="meta" id="meta"></div></div>
  </aside>
  <main class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5z" fill="var(--edge)"/></marker>
        <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5z" fill="var(--edge-hi)"/></marker>
        <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5z" fill="var(--accent)"/></marker>

/* ---------- view transform ---------- */
function applyView(v){
  st.view = v;
  vp.setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
  $('#grid').setAttribute('patternTransform', `translate(${v.x},${v.y}) scale(${v.k})`);
}
function stageSize(){ const r = svg.getBoundingClientRect(); return {w:r.width, h:r.height}; }
function fitView(){
  const L = st.layout; if (!L) return st.view;

  const gw = Math.max(L.res.width||1, 1), gh = Math.max(L.res.height||1, 1);
  const pad = Math.min(56, w/8, h/8);
  const k = Math.max(0.05, Math.min((w-pad*2)/gw, (h-pad*2-30)/gh, 1.1));
  return {k, x:(w-gw*k)/2, y:(h-gh*k)/2 - 10};
}
function boxView(b, fill){
  const {w,h} = stageSize();
  const k = Math.max(0.05, Math.min(w/Math.max(b.w,1), h/Math.max(b.h,1)) * (fill||0.9));
  return {k, x:w/2-(b.x+b.w/2)*k, y:h/2-(b.y+b.h/2)*k};

    const from = {...st.view}; const t0 = performance.now();
    const fFrom = fade ? fade[0] : null, fTo = fade ? fade[1] : null;
    if (anim) cancelAnimationFrame(anim);
    const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    const lerp = (a,b,t) => a+(b-a)*t;
    const safe = k => (isFinite(k) && k > 0) ? k : 1;
    from.k = safe(from.k); to = {...to, k: safe(to.k)};
    const zx = Math.log(from.k), zy = Math.log(to.k);
    const step = now => {
      const t = Math.min(1, (now-t0)/dur), e = ease(t);
      const k = Math.exp(lerp(zx, zy, e));

      const px = lerp(from.x/from.k, to.x/to.k, e) * k, py = lerp(from.y/from.k, to.y/to.k, e) * k;
      applyView({k, x: Math.abs(zy-zx) > 0.3 ? px : lerp(from.x,to.x,e), y: Math.abs(zy-zx) > 0.3 ? py : lerp(from.y,to.y,e)});
      if (fade) vp.style.opacity = lerp(fFrom, fTo, e);
      if (t < 1) anim = requestAnimationFrame(step); else { anim = null; applyView(to); resolve(); }
    };
    anim = requestAnimationFrame(step);
  });
}

/* ---------- navigation ---------- */
let busy = false;
async function openNode(id){
  if (busy) return;

  await animateView(boxView({x:ne.p.x, y:ne.p.y, w:ne.m.w, h:ne.m.h}, 1.6), 380, [1, 0]);
  st.path = [...st.path, id]; st.sel = null; closePanel();
  await renderLevel();
  const f = fitView();
  const {w,h} = stageSize();
  applyView({k:f.k*0.55, x:w/2 - ((w/2 - f.x)*0.55), y:h/2 - ((h/2 - f.y)*0.55)});

}
async function goTo(path, selectId){

/* ---------- workflows ---------- */

}

  edgeEls.forEach(x => x.g.classList.remove('f-on','f-now'));

    const s = steps[j];

const PLAY = '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4l8.6-5.2z" fill="currentColor"/></svg>';
const PAUSE = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>';

/* ---------- search ---------- */
const INDEX = [];
(function index(g, path, trail){
  (g.nodes||[]).forEach(n => {
    INDEX.push({n, path, trail, hay:[n.label, n.summary, n.details, (n.files||[]).join(' '), (n.tags||[]).join(' ')].join(' ').toLowerCase()});
    if (hasKids(n)) index(n.children, [...path, n.id], [...trail, n.label]);
  });
})(DATA.root, [], []);
let resIdx = 0, resList = [];
function runSearch(q){
  const box = $('#results');
  q = q.trim().toLowerCase();
  if (!q){ box.classList.remove('open'); return; }
  const terms = q.split(/\s+/);
  resList = INDEX.filter(x => terms.every(t => x.hay.includes(t)))
    .map(x => ({...x, score: (x.n.label.toLowerCase().includes(q) ? 0 : 1) + x.path.length*0.1}))
    .sort((a,b) => a.score - b.score).slice(0, 30);
  resIdx = 0;
  box.innerHTML = resList.length ? resList.map((r,i) => `<button data-i="${i}" class="${i===0?'active':''}"><span class="dot" style="background:${kc(kindOf(r.n.kind))}"></span><span><div class="r-label">${esc(r.n.label)}</div><div class="r-path">${esc(['Overview', ...r.trail].join(' › '))}</div></span></button>`).join('') : '<div class="empty">No matches</div>';
  box.classList.add('open');
  box.querySelectorAll('button').forEach(b => b.onclick = () => pick(+b.dataset.i));
}
function pick(i){
  const r = resList[i]; if (!r) return;
  $('#results').classList.remove('open'); $('#search').value = ''; $('#search').blur();
  if (r.path.join('/') === st.path.join('/')) select(r.n.id, {flash:true, pan:true});
  else goTo(r.path, r.n.id);
}
$('#search').addEventListener('input', e => runSearch(e.target.value));
$('#search').addEventListener('keydown', e => {
  const items = [...$('#results').querySelectorAll('button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if (!items.length) return;
    resIdx = (resIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((b,i) => b.classList.toggle('active', i === resIdx)); items[resIdx].scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter'){ pick(resIdx); }
  else if (e.key === 'Escape'){ $('#results').classList.remove('open'); e.target.blur(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').classList.remove('open'); });

/* ---------- pan / zoom ---------- */
let drag = null, dragMoved = false;
const touches = new Map(); let pinch = null;
svg.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (touches.size === 2){
      const [a, b] = [...touches.values()]; const r = svg.getBoundingClientRect();
      pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), k:st.view.k, cx:(a.x+b.x)/2 - r.left, cy:(a.y+b.y)/2 - r.top, v:{...st.view}};
      drag = null; dragMoved = true; return;
    }
  }
  if (e.button !== 0) return;
  drag = {x:e.clientX, y:e.clientY, vx:st.view.x, vy:st.view.y}; dragMoved = false;
});
window.addEventListener('pointermove', e => {
  if (pinch && touches.has(e.pointerId)){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const [a, b] = [...touches.values()]; const r = svg.getBoundingClientRect();
    const k = Math.max(0.12, Math.min(3, pinch.k * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d));
    const cx = (a.x+b.x)/2 - r.left, cy = (a.y+b.y)/2 - r.top;
    const wx = (pinch.cx - pinch.v.x)/pinch.v.k, wy = (pinch.cy - pinch.v.y)/pinch.v.k;
    applyView({k, x:cx - wx*k, y:cy - wy*k});
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragMoved && Math.hypot(dx,dy) < 4) return;
  if (!dragMoved){ dragMoved = true; svg.classList.add('dragging'); try { svg.setPointerCapture(e.pointerId); } catch(_){} }
  applyView({...st.view, x:drag.vx+dx, y:drag.vy+dy});
});
const endTouch = e => { touches.delete(e.pointerId); if (touches.size < 2 && pinch){ pinch = null; setTimeout(() => dragMoved = false, 0); } };
window.addEventListener('pointercancel', endTouch);
window.addEventListener('pointerup', e => { if (e.pointerType === 'touch') endTouch(e); });
window.addEventListener('pointerup', () => { if (drag){ svg.classList.remove('dragging'); drag = null; setTimeout(() => dragMoved = false, 0); } });
function zoomAt(sx, sy, factor){
  const v = st.view; const k = Math.max(0.12, Math.min(3, v.k*factor));
  const wx = (sx - v.x)/v.k, wy = (sy - v.y)/v.k;
  applyView({k, x:sx - wx*k, y:sy - wy*k});
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey){ zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY*0.01)); }
  else applyView({...st.view, x:st.view.x - e.deltaX, y:st.view.y - e.deltaY});
}, {passive:false});
svg.addEventListener('click', e => {
  if (dragMoved) return;
  if (e.target === svg || e.target.id === 'bgGrid'){ nodeEls.forEach(x => x.g.classList.remove('selected')); st.sel = null; closePanel(); }
});
svg.addEventListener('dblclick', e => { if (e.target === svg || e.target.id === 'bgGrid') animateView(fitView(), 380); });
$('#zoomIn').onclick = () => { const {w,h} = stageSize(); zoomAt(w/2, h/2, 1.25); };
$('#zoomOut').onclick = () => { const {w,h} = stageSize(); zoomAt(w/2, h/2, 0.8); };
$('#fitBtn').onclick = () => animateView(fitView(), 380);
$('#upBtn').onclick = goUp;
$('#fbPrev').onclick = () => { play(false); setStep(st.step-1); };
$('#fbNext').onclick = () => { play(false); setStep(st.step+1); };
$('#fbPlay').onclick = () => { if (st.flow && st.step >= st.flow.steps.length-1 && !st.playing) setStep(0); play(!st.playing); };
$('#fbClose').onclick = () => stopFlow();
$('#menuBtn').onclick = () => $('#left').classList.toggle('open');

/* ---------- theme ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('bp-theme'); if (t) root.dataset.theme = t; } catch(_){}
$('#themeBtn').onclick = () => {
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  root.dataset.theme = cur === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('bp-theme', root.dataset.theme); } catch(_){}
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/'){ e.preventDefault(); $('#search').focus(); }
  else if (e.key === 'Escape'){
    if (st.flow) stopFlow();
    else if (st.sel){ nodeEls.forEach(x => x.g.classList.remove('selected')); st.sel = null; closePanel(); }
    else goUp();
  }
  else if (e.key === 'f' || e.key === 'F') animateView(fitView(), 380);
  else if (e.key === 'Enter' && st.sel){ const ne = nodeEls.get(st.sel); if (ne && hasKids(ne.n)) openNode(st.sel); }
  else if (st.flow && e.key === 'ArrowRight'){ play(false); setStep(st.step+1); }
  else if (st.flow && e.key === 'ArrowLeft'){ play(false); setStep(st.step-1); }
  else if (st.flow && e.key === ' '){ e.preventDefault(); $('#fbPlay').click(); }
  else if (e.key === 'Backspace') goUp();
});

/* ---------- hash routing ---------- */
let hashLock = false;
function updateHash(){
  const h = '#/' + st.path.map(encodeURIComponent).join('/');
  if (location.hash !== h){ hashLock = true; history.replaceState(null, '', h); setTimeout(() => hashLock = false, 0); }
}
function pathFromHash(){ return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent); }
window.addEventListener('hashchange', () => { if (!hashLock) goTo(pathFromHash()); });
window.addEventListener('resize', () => { /* keep the view; F refits */ });

/* ---------- boot ---------- */
(async () => {
  document.title = (DATA.title ? DATA.title + ' · ' : '') + 'Exploded View';
  const pl = $('#productLink'); const home = (DATA.tool && DATA.tool.url) || ''; if (/^https:\/\//.test(home)) pl.href = home; else pl.removeAttribute('href');
  st.path = pathFromHash();
  vp.style.opacity = 0;
  await renderLevel();
  const f = fitView();
  applyView({...f, k:f.k*0.94});
  await animateView(f, 420, [0, 1]);
})();
})();
</script>
</body>
